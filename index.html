<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>UPI Pay • One Page</title>
  <!-- clean, minimal, mobile-first style -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #f8faff 0%, #edf2f9 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      padding: 1.5rem;
      margin: 0;
    }

    .card {
      max-width: 480px;
      width: 100%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      background: #ffffff;
      border-radius: 48px 48px 40px 40px;
      box-shadow: 0 25px 50px -10px rgba(0, 20, 40, 0.25), 0 8px 20px rgba(0, 0, 0, 0.05);
      padding: 2.5rem 1.8rem 2.8rem;
      transition: transform 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.3);
      text-align: center;
    }

    /* subtle decorative icon */
    .upi-badge {
      display: inline-block;
      background: #0c1e3a;
      color: white;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.3px;
      padding: 0.4rem 1.2rem;
      border-radius: 60px;
      background: linear-gradient(135deg, #1a2f4f, #0c1e3a);
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      margin-bottom: 1.8rem;
      text-transform: uppercase;
    }

    .payee-card {
      background: #f2f6fe;
      border-radius: 28px;
      padding: 1.2rem 0.8rem;
      margin: 1.8rem 0 2.2rem;
      border: 1px solid rgba(0, 60, 130, 0.08);
    }

    .payee-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #3c5a7a;
      font-weight: 600;
      opacity: 0.7;
    }

    .payee-name {
      font-size: 1.8rem;
      font-weight: 700;
      color: #0a1d35;
      letter-spacing: -0.5px;
      margin: 0.25rem 0 0.1rem;
      word-break: break-word;
    }

    .payee-id {
      font-family: 'SF Mono', 'Menlo', 'Monaco', 'Cascadia Code', monospace;
      background: #e3ebf7;
      padding: 0.3rem 1rem;
      border-radius: 60px;
      display: inline-block;
      font-size: 0.85rem;
      color: #10345e;
      font-weight: 500;
      letter-spacing: 0.2px;
      word-break: break-all;
      max-width: 100%;
      border: 1px solid #cbdae9;
    }

    .amount-box {
      margin: 2rem 0 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .currency-symbol {
      font-size: 1.8rem;
      font-weight: 400;
      color: #1a3350;
      margin-right: 4px;
    }

    .amount-number {
      font-size: 4.2rem;
      font-weight: 700;
      letter-spacing: -2px;
      color: #08203b;
      line-height: 1;
    }

    .amount-number small {
      font-size: 1.8rem;
      font-weight: 500;
      color: #36577a;
      margin-left: 4px;
    }

    .remark-tag {
      background: #eaf0fa;
      padding: 0.4rem 1.6rem;
      border-radius: 60px;
      font-size: 0.85rem;
      color: #1f3f62;
      font-weight: 450;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #cfdff0;
      margin-top: 0.4rem;
    }

    .remark-tag span {
      opacity: 0.6;
      font-weight: 300;
      margin-right: 4px;
    }

    /* main CTA — pay now button */
    .pay-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #0a2c4b;
      background: linear-gradient(145deg, #123a5e, #08203b);
      border: none;
      color: white;
      font-weight: 600;
      font-size: 1.6rem;
      padding: 1.2rem 2.8rem;
      border-radius: 120px;
      width: 100%;
      max-width: 320px;
      margin: 0.5rem auto 0.8rem;
      box-shadow: 0 14px 28px -8px rgba(10, 40, 80, 0.3), 0 4px 12px rgba(0, 0, 0, 0.05);
      transition: all 0.15s ease;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.1);
      letter-spacing: 0.5px;
      gap: 10px;
      text-decoration: none;
      touch-action: manipulation;
    }

    .pay-btn:active {
      transform: scale(0.96);
      box-shadow: 0 6px 12px -4px rgba(0, 20, 50, 0.4);
      background: #0a2a47;
    }

    .pay-btn:hover {
      background: #0f3457;
      box-shadow: 0 18px 32px -10px #0a1f3a7a;
    }

    .pay-btn i {
      font-size: 1.8rem;
      line-height: 1;
      font-style: normal;
    }

    .upi-note {
      font-size: 0.8rem;
      color: #3e6185;
      margin-top: 1.8rem;
      background: #ecf3fc;
      padding: 0.6rem 1.2rem;
      border-radius: 60px;
      display: inline-block;
      backdrop-filter: blur(4px);
      border: 1px solid #d3e2f5;
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    .upi-note strong {
      font-weight: 600;
      color: #0a2c4b;
    }

    /* mobile friendly */
    @media (max-width: 480px) {
      .card { padding: 1.8rem 1.2rem 2rem; }
      .amount-number { font-size: 3.4rem; }
      .amount-number small { font-size: 1.5rem; }
      .payee-name { font-size: 1.5rem; }
      .pay-btn { font-size: 1.3rem; padding: 1rem 1.8rem; max-width: 100%; }
      .upi-badge { font-size: 0.7rem; padding: 0.3rem 1rem; }
    }

    /* simple loader / feedback */
    .pay-btn:active::after {
      content: "↻";
      display: inline-block;
      animation: spin 0.6s linear;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* bottom fine print */
    .footer-note {
      margin-top: 2rem;
      font-size: 0.7rem;
      color: #6f8aa8;
      letter-spacing: 0.2px;
      border-top: 1px solid #d4e1f0;
      padding-top: 1.5rem;
      opacity: 0.8;
    }

    .footer-note a {
      color: #1a4b77;
      text-decoration: none;
      border-bottom: 1px dotted #b3cce5;
    }

    /* inline icon */
    .upi-icon {
      font-size: 1.3rem;
      line-height: 1;
    }
  </style>
</head>
<body>
<div class="card" role="main" aria-label="UPI payment card">

  <!-- header badge -->
  <div class="upi-badge">
    ⚡ UPI secure
  </div>

  <!-- payee info -->
  <div class="payee-card">
    <div class="payee-label">📱 pay to</div>
    <div class="payee-name">rahulvermamusic</div>
    <div class="payee-id">rahulverma03061998@oksbi</div>
  </div>

  <!-- amount block -->
  <div class="amount-box">
    <div style="display: flex; align-items: baseline; justify-content: center; gap: 2px;">
      <span class="currency-symbol">₹</span>
      <span class="amount-number">700<small>.00</small></span>
    </div>
    <div class="remark-tag">
      <span>📌</span> Payment · rahulvermamusic
    </div>
  </div>

  <!-- PAY NOW button – UPI deep link -->
  <a href="upi://pay?pa=rahulverma03061998@oksbi&pn=rahul%20verma&am=700.00&cu=INR&aid=uGICAgMDU46qdVg" 
     class="pay-btn" 
     role="button"
     aria-label="Pay now with UPI">
    <i>💳</i> Pay Now
  </a>

  <!-- extra UPI hint -->
  <div class="upi-note">
    <strong>upi://</strong> pay · 700 INR
  </div>

  <!-- small footer (just for style) -->
  <div class="footer-note">
    <span>🔐 UPI  •  one‑tap payment</span>
  </div>

</div>
</body>
</html>
